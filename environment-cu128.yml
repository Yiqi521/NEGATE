# navsim-cu128：Blackwell 兼容环境（torch 2.7.1 + CUDA 12.8；同时支持 Ampere / Ada）。由本机验证过的环境导出。
# 使用：conda env create -f environment-cu128.yml
#   然后（两步不能省，且顺序固定）：
#   pip install --no-deps "nuplan-devkit @ git+https://github.com/motional/nuplan-devkit/@nuplan-devkit-v1.2"
#   pip install --no-deps -e <navsim v1.1 目录>        # 必须 --no-deps，否则 navsim 的 setup.py 会把 torch 钉回 2.0.1
#   python -c "import torch; assert torch.__version__.startswith('2.7.1') and 'sm_120' in torch.cuda.get_arch_list()"
